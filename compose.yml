services:
  web:
    build: .
    ports:
      - "3000:8000"
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/appdb
      APP_NAME: ${APP_NAME:-sdp-starter}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
